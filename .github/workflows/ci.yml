name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [highest]
        include:
          # composer.json advertises ranges; the committed lock only ever proves
          # one point in them. This run proves the lower bounds resolve and pass.
          - php: '8.4'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          else
            composer update --prefer-dist --no-interaction
          fi

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/pest

  # The suite runs on sqlite::memory:, which is far more forgiving than anything
  # this package actually ships into. SQLite turns an unknown double-quoted
  # identifier into a string literal, has no default LIKE escape character, and
  # coerces types MySQL and Postgres reject outright -- so a query that 500s in
  # production can be green here. These jobs are what make that visible.
  databases:
    name: ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: saddle
          MYSQL_DATABASE: saddle
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psaddle"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: saddle
          POSTGRES_DB: saddle
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - name: Run the suite against ${{ matrix.db }}
        env:
          SADDLE_TEST_DB: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
          DB_DATABASE: saddle
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: saddle
        run: vendor/bin/pest

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

      # The bundle is committed and is what Composer ships, so a PR that edits
      # a .vue file without rebuilding used to pass CI fully green and publish
      # stale assets. This job regenerated dist/ and then threw it away.
      - name: Fail if the committed bundle is stale
        run: git diff --exit-code dist
